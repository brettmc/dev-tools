name: PHP QA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # for the Codecov upload
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4', '8.5']
        experimental: [false]
        include:
          - php-version: '8.6'
            experimental: true

    env:
      extensions: ast

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ env.extensions }}

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: |
          composer --version
          composer install --prefer-dist --no-progress

      - name: Check Style
        id: style
        continue-on-error: ${{ matrix.experimental }}
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1
        run: |
          vendor-bin/php-cs-fixer/vendor/bin/php-cs-fixer --version
          vendor-bin/php-cs-fixer/vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.php --dry-run --stop-on-violation --using-cache=no -vvv

      - name: Run Phan
        id: phan
        continue-on-error: ${{ matrix.experimental }}
        env:
          XDEBUG_MODE: off
          PHAN_DISABLE_XDEBUG_WARN: 1
        run: |
          vendor-bin/phan/vendor/bin/phan --version
          vendor-bin/phan/vendor/bin/phan

      - name: Run Psalm
        id: psalm
        continue-on-error: ${{ matrix.experimental }}
        run: |
          vendor-bin/psalm/vendor/bin/psalm --version
          vendor-bin/psalm/vendor/bin/psalm --output-format=github

      - name: Run Phpstan
        id: phpstan
        continue-on-error: ${{ matrix.experimental }}
        run: |
          vendor/bin/phpstan --version
          vendor/bin/phpstan analyse --error-format=github

      - name: Run PHPUnit
        id: phpunit
        continue-on-error: ${{ matrix.experimental }}
        run: |
          vendor/bin/phpunit --version
          php -dzend.assertions=1 vendor/bin/phpunit --coverage-text --coverage-clover=coverage.clover

      - name: Code Coverage
        if: matrix.php-version == '8.4'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: ./coverage.clover
          verbose: false
